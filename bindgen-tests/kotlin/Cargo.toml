[package]
name = "uniffi-bindgen-tests-kotlin"
version = "0.31.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
camino = "1"
glob = "0.3"
uniffi = { path = "../../uniffi", features = ["bindgen", "pointer-ffi"] }
uniffi-bindgen-tests = { path = "../lib", default-features = false, features = [
    "simple_fns",
    "primitive_types",
    "records",
    "enums",
    "collections",
    "options",
    "interfaces",
    "custom_types",
    "errors",
    "callback_interfaces",
] }
